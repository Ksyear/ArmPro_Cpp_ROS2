# armpi_vr_bridge (Protocol v3 수신기) 기본 설정.
# 규칙: docs/01_PROTOCOL_V3_SPEC.md, docs/02_ROS2_INTERFACES.md
# 주의: ROS 2 매개변수는 자료형이 엄격하다. 실수 매개변수에는 반드시 소수점을 쓴다(1 이 아니라 1.0).
armpi_vr_bridge:
  ros__parameters:
    bind_address: "0.0.0.0"
    port: 5001                       # 조종(UDP). ACK 는 같은 소켓으로 보낸 주소·포트에
    poll_interval_sec: 0.02          # 수신 루프 poll 주기(패킷이 없을 때도 watchdog 검사)
    rx_stall_timeout_sec: 0.5        # 수신 루프가 이만큼 멈추면 정지·새 중립 요구

    # 시간값 (spec §4)
    base_watchdog_sec: 0.4           # 차체: 마지막 인정 command 후 정지까지
    arm_watchdog_sec: 0.4            # 팔: 마지막 인정 arm_command 후 현재 위치 유지까지(토크 유지)
    lease_sec: 1.0                   # 소유권 유지(클라이언트 재시도 1.1 s 와 맞물림). 두 watchdog 보다 커야 함
    control_state_max_age_sec: 2.0   # /armpi/control_state 가 이보다 오래되면 활성 명령 not_owner

    publish_rate_hz: 20.0            # /armpi/cmd_vel 주기 발행, 팔 active 동안 ArmTarget 재발행
    state_rate_hz: 2.0               # /armpi_vr_bridge/state 주기(+ 변화 시 즉시)
    stats_log_period_sec: 10.0
    accept_estop_from_any_client: true   # 소유자가 아닌 유효 클라이언트의 emergency_stop 도 latch
    retired_limit: 1024              # disconnect·교체된 UUID 기억 수

    # 차체 속도 상한 (spec §5, 초기 보수값 — 실측 후 조정)
    # vx = forward × max_vx, vy = strafe × max_vy(+왼쪽), wz = turn × max_wz(+좌회전)
    # 사용자 결정 2026-11-04, 바퀴 방향 실기 시험 전(이전 0.10/0.10/0.60). armpi_bringup/config/armpi.yaml 과 같게
    chassis.max_vx_m_s: 0.25
    chassis.max_vy_m_s: 0.25
    chassis.max_wz_rad_s: 1.2

    # 팔 작업 공간 상자(armpi_arm_base, m). 밖이면 workspace_limit. armpi_bringup/config/armpi.yaml 과 같은 값.
    arm.workspace.x_min: 0.05
    arm.workspace.x_max: 0.32
    arm.workspace.y_min: -0.25
    arm.workspace.y_max: 0.25
    arm.workspace.z_min: -0.08
    arm.workspace.z_max: 0.32

    # ── 닿을 수 없는 팔 목표의 처리 (armpi_vr_bridge·armpi_web_gateway·armpi_control 이 같은 값을 쓴다) ──
    # "nearest": 거부하지 않고 닿을 수 있는 가장 가까운 자세로 받는다(armpi_kinematics/reachability.hpp).
    #   ① 상자 밖 위치 → 상자 면으로 ② 요청 pitch 로 안 풀리면 가까운 pitch ③ 그래도 안 되면 마지막 목표 쪽으로 당김.
    #   작업 공간 상자·관절 범위·손목 높이·팔꿈치 굽힘 제한은 그대로다(결과는 항상 상자 안, IK 해 있음).
    #   그리퍼는 위치가 보정돼도 그대로 반영한다. ACK 는 accepted/ok(형식 변화 없음).
    #   근거(2026-11-11 계산, 이 로봇 프로필): 상자 안 격자 9,261점 중 pitch 를 고정하면 IK 가 풀리는 점이 6–33 %
    #   (손끝 아래 −90° 는 5.8 %), pitch 를 ±π/2 안에서 바꿀 수 있으면 69–85 %.
    # "reject": 규격 v3 원래 동작(workspace_limit·ik_unreachable 로 거부, 팔은 마지막 목표에 멈춤).
    # 사용자 결정 2026-11-11(VR 조종 때 팔이 자꾸 멈춤), 실기 확인 전.
    arm.target_policy: "nearest"
    arm.nearest.max_pitch_change_rad: 1.5707963267948966  # 요청 pitch 에서 최대 ±π/2 까지 바꿈. 0 = pitch 를 바꾸지 않음
    arm.nearest.pitch_step_rad: 0.017453292519943295      # 찾는 간격 1°
    arm.nearest.pitch_min_rad: -1.5707963267948966        # 바꾼 pitch 의 범위 −90°(손끝 아래) ..
    arm.nearest.pitch_max_rad: 0.5235987755982988         # .. +30°
    arm.nearest.allow_position_change: true               # ③ 단계(위치 당김) 사용
    arm.nearest.bisect_iterations: 14

    # 기구학 (armpi_kinematics::Params 와 같은 이름). IK 해가 없으면 ik_unreachable.
    # 이 파일은 수신기 단독 실행(vr_bridge.launch.py, 제어기 없는 시험)용이다. 관절 기준·범위는 시험용 값
    # (armpi_bringup config/test_hardware_profile.yaml 과 같음, 실제 로봇 값 아님). 로봇에서는 armpi.launch.py 가
    # armpi.yaml + hardware_profile.yaml 을 넣는다.
    arm.kinematics.base_height_m: 0.064605      # 링크 길이: Hiwonder 공개 ArmPi FPV 기구학 값(ArmPi Pro 실측 확인 필요)
    arm.kinematics.upper_arm_m: 0.10048
    arm.kinematics.forearm_m: 0.094714
    arm.kinematics.hand_m: 0.16331
    arm.kinematics.j1_sign: 1.0                 # 시험용
    arm.kinematics.j1_offset: 0.0
    arm.kinematics.j2_sign: 1.0
    arm.kinematics.j2_offset: -1.4
    arm.kinematics.j3_sign: -1.0
    arm.kinematics.j3_offset: 0.0
    arm.kinematics.j4_sign: 1.0
    arm.kinematics.j4_offset: 0.1
    arm.kinematics.min_wrist_height_m: 0.0      # 손목 관절축이 바닥보다 낮으면 해 없음
    arm.kinematics.min_elbow_bend_rad: 0.05     # 일자로 펴진 특이 자세 근처 거부
    arm.kinematics.joint_min: [-2.0943951023931953, -1.4, -2.0943951023931953, -1.9]   # 시험용, joint1..joint4 (rad)
    arm.kinematics.joint_max: [2.0943951023931953, 1.4, 2.0943951023931953, 1.9]

    # [v3] 허용 송신 주소(CIDR). 비우면 모두 허용. 목록 밖 주소는 응답 없이 버린다(조종·검색 모두).
    # 예: allowed_sources: ["192.168.2.0/24", "10.42.0.5"]
    # 빈 목록은 이 줄을 생략한다(Humble YAML 은 빈 배열의 자료형을 정할 수 없다). [""] 도 "모두 허용"으로 처리한다.
    # allowed_sources: ["192.168.2.0/24"]

    discovery.enabled: true
    discovery.port: 5002
    discovery.name: ""               # 비우면 hostname(최대 32자)
    discovery.max_replies_per_second: 20

    frame_id: "base_link"
    arm_frame_id: "armpi_arm_base"
    cmd_vel_topic: "/armpi/cmd_vel"
    arm_target_topic: "/armpi/arm/target"
    estop_request_topic: "/armpi/estop_request"
    control_state_topic: "/armpi/control_state"
