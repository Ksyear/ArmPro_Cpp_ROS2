# ArmPi: 로그인 세션(SSH 등)이 끝나도 ubuntu 사용자의 공유 메모리(/dev/shm)를 지우지 않는다.
# 왜(2026-11-11 실기): logind 기본값 RemoveIPC=yes 는 사용자의 마지막 세션이 끝날 때 그 사용자의 POSIX 공유 메모리를
# 모두 지운다. 로봇의 ROS 2 노드(armpi.service·armpi-web.service, User=ubuntu)는 Fast DDS 공유 메모리로 서로 통신하므로,
# SSH 접속을 닫는 순간 노드 사이 전달이 끊겨 수신기가 "control_state 2.000s 넘게 미수신"으로 조종을 막았다.
[Login]
RemoveIPC=no
