# ArmPi: ROS 2(Fast DDS) 대용량 메시지용 소켓 버퍼. 로봇의 /etc/sysctl.d/ 에 둔다(sudo sysctl --system 으로 적용).
#
# 왜: 카메라 원시 영상(640×480 rgb8)은 한 장 921,600 B, 15 fps 면 약 13.8 MB/s 다. 리눅스 기본 소켓 버퍼(212,992 B)는
#     한 장보다 작아서, UDP 로 쪼개 보내는 신뢰(RELIABLE) DDS 통신에서 조각이 버려지고 재전송이 반복될 수 있다.
#     2026-11-04 실기: best-effort 구독은 12.56 Hz 를 받았지만 RELIABLE 구독(web_video_server)에는 새 영상이 오지 않았다
#     (docs/11, 원인은 추정). 이 설정을 넣은 v2 이미지에서는 웹 영상 스트림이 약 12 fps 로 나왔다(2026-11-04 실기).
# 근거: ROS 2 문서 "DDS tuning information" — 큰 메시지가 신뢰 설정에서도 전달되지 않을 때 커널 수신 버퍼 상한을 올리고,
#       손실이 있는 Wi-Fi 에서는 IP 조각 대기 시간·재조립 메모리를 조정하라는 권장. Fast DDS 는 소켓 버퍼 크기를
#       XML 의 sendBufferSize/receiveBufferSize 로 요청하며, 요청값은 이 상한으로 잘린다.
#       (armpi_bringup/config/fastdds_armpi.xml: UDPv4 버퍼 4 MiB, 공유 메모리 세그먼트 8 MiB)

# 상한 16 MiB: XML 이 요청한 4 MiB 가 잘리지 않고, 필요하면 더 키울 여유를 둔다.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# 기본 4 MiB(원시 영상 약 4장): 버퍼 크기를 따로 정하지 않는 소켓(다른 DDS 참가자 등)용.
# 메모리는 데이터가 쌓일 때만 쓰인다(미리 잡지 않음).
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304

# IP 조각 재조립(ROS 2 DDS tuning 권장값): 조각을 기다리는 시간 3 s(기본 30 s), 재조립 메모리 상한 128 MiB.
net.ipv4.ipfrag_time = 3
net.ipv4.ipfrag_high_thresh = 134217728
